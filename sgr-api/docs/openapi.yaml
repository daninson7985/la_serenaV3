openapi: 3.0.3
info:
  title: API de consulta SGR - Municipalidad de La Serena
  version: 1.0.0
  description: |-
    API REST de **solo lectura** del Sistema de Gestión de Resultados (SGR).

    1. Obtén un token en `POST /api/v1/token/` con tu usuario y contraseña del SGR (y `codigo_2fa` si tu cuenta tiene verificación en dos pasos).
    2. Presiona **Authorize** e ingresa el token.

    Cada usuario ve solo lo que su rol permite en el SGR. Los listados vienen paginados (50 por página; `?page=` y `?page_size=` hasta 500).
paths:
  /api/v1/ajustes-incentivo/:
    get:
      operationId: ajustes_incentivo_list
      description: Incentivos y penalizaciones. Administrador y Coordinador ven todos;
        el Funcionario, los suyos.
      parameters:
      - in: query
        name: estado
        schema:
          type: string
        description: Filtra por estado (valor exacto).
      - in: query
        name: funcionario
        schema:
          type: integer
        description: Filtra por id de funcionario.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: periodo
        schema:
          type: integer
        description: Filtra por id de periodo.
      tags:
      - Incentivos
      security:
      - TokenSGR: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAjusteIncentivoList'
          description: ''
