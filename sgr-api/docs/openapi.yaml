      description: Intercambia usuario y contraseña del SGR por un token. Si la cuenta
        tiene verificación en dos pasos, envía también `codigo_2fa`. Tras varios intentos
        fallidos el usuario queda bloqueado unos minutos (respuesta 429).
      summary: Obtener token
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
